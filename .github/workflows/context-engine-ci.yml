name: CE-002 Context Engine

on:
  push:
    branches:
      - research/context-engine-002
  pull_request:
    branches:
      - research/context-engine-001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check src/loom-context-engine/core.mjs
          node --check src/loom-context-engine/evidence-archive.mjs
          node --check src/loom-context-engine/evidence-retrieval.mjs
          node --check scripts/loom-context-webui-gateway.mjs
          node --check scripts/replay-context-engine-rpc.mjs
          node --check scripts/loom-context-evidence.mjs
          node --experimental-strip-types --check src/loom-context-engine/index.ts
          python3 -m py_compile scripts/realistic-context-engine-benchmark.py
          python3 -m py_compile scripts/recover-realistic-context-engine-benchmark.py
          python3 -m py_compile scripts/live-coding-evidence-retrieval.py
          python3 -m py_compile scripts/live-coding-evidence-retrieval-lite.py
          python3 -m py_compile scripts/recover-live-coding-evidence-retrieval.py
          python3 -m py_compile scripts/diagnose-live-coding-evidence-retrieval.py
          bash -n scripts/install-forge-loom.sh
          bash -n scripts/verify-context-engine.sh
          bash -n scripts/smoke-context-engine.sh
          bash -n scripts/stress-context-engine.sh
          bash -n scripts/realistic-context-engine-benchmark.sh
          bash -n scripts/live-tool-heavy-context-engine.sh
          bash -n scripts/resource-context-engine.sh
          bash -n scripts/live-evidence-archive.sh
          bash -n scripts/live-evidence-retrieval.sh
          bash -n scripts/live-coding-evidence-retrieval.sh
          bash -n scripts/live-coding-evidence-retrieval-lite.sh
      - name: Embedded live harness syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tempfile
          import subprocess

          def check(path):
              lines = Path(path).read_text().splitlines()
              python_blocks = []
              node_blocks = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if "<<'PY'" in line:
                      end = "PY"
                      bucket = python_blocks
                  elif "<<'NODE'" in line:
                      end = "NODE"
                      bucket = node_blocks
                  else:
                      i += 1
                      continue
                  block = []
                  i += 1
                  while i < len(lines) and lines[i] != end:
                      block.append(lines[i])
                      i += 1
                  if i >= len(lines):
                      raise SystemExit(f"unterminated {end} heredoc in {path}")
                  bucket.append("\n".join(block) + "\n")
                  i += 1

              for index, block in enumerate(python_blocks, start=1):
                  compile(block, f"{path}#py{index}", "exec")

              for index, block in enumerate(node_blocks, start=1):
                  with tempfile.NamedTemporaryFile("w", suffix=".mjs", delete=False) as handle:
                      handle.write(block)
                      temp_path = handle.name
                  subprocess.run(["node", "--check", temp_path], check=True)

          check("scripts/live-evidence-archive.sh")
          check("scripts/live-evidence-retrieval.sh")
          PY
      - name: Governor tests
        run: node --test test/context-engine-core.test.mjs
      - name: Evidence archive tests
        run: node --test test/evidence-archive.test.mjs
      - name: Evidence retrieval tests
        run: node --test test/evidence-retrieval.test.mjs test/evidence-retrieval-trigger.test.mjs
      - name: Repository invariants
        run: bash scripts/verify-context-engine.sh
